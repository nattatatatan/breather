<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FAF9F6; display: flex; flex-direction: column; padding: 56px 28px 38px;">

    </a>
    <div style="font-size: 10px; letter-spacing: 0.3em; text-transform: uppercase; color: #6E6B62;">Mode</div>

  <h1 style="margin: 0 0 6px; font-family: 'Cormorant Garamond', Georgia, serif; font-size: 40px; line-height: 1.12; font-weight: 300; color: #1C1B17; text-wrap: pretty;">How are you<br>working today?</h1>
  <p style="margin: 0 0 34px; font-size: 13px; line-height: 1.6; color: #6E6B62; max-width: 290px;">The mode sets what you do with attention. The intention you choose next is its companion — the flavour, not the method.</p>

  <div style="display: flex; flex-direction: column; gap: 14px;">

    <button type="button" style="appearance: none; text-align: left; cursor: pointer; display: flex; gap: 18px; padding: 22px 20px; background: #F1EEE7; border: 1px solid #B04A22; border-radius: 3px; font-family: 'Jost', system-ui, sans-serif;">
      <svg sc-camel-view-box="0 0 64 64" width="52" height="52" aria-hidden="true" style="flex-shrink: 0; margin-top: 4px;">
        <circle cx="32" cy="32" r="27" fill="none" stroke="#E0D6CA" stroke-width="1.2"></circle>
        <circle cx="32" cy="32" r="18" fill="none" stroke="#D3BFA9" stroke-width="1.2"></circle>
        <circle cx="32" cy="32" r="9" fill="none" stroke="#C99973" stroke-width="1.2"></circle>
        <circle cx="32" cy="32" r="4" fill="#B04A22"></circle>
      </svg>
      <span style="flex-grow: 1;">
        <span style="display: block; font-family: 'Cormorant Garamond', Georgia, serif; font-size: 30px; font-weight: 400; color: #1C1B17; line-height: 1.1;">Samatha</span>
        <span style="display: block; font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; color: #B04A22; margin: 6px 0 8px;">Calm abiding</span>
        <span style="display: block; font-size: 13px; line-height: 1.6; color: #55534C;">One object, held. Attention narrows and gathers until the mind unifies around it.</span>
      </span>
    </button>

    <button type="button" style="appearance: none; text-align: left; cursor: pointer; display: flex; gap: 18px; padding: 22px 20px; background: #FFFFFF; border: 1px solid #E4E0D8; border-radius: 3px; font-family: 'Jost', system-ui, sans-serif;">
      <svg sc-camel-view-box="0 0 64 64" width="52" height="52" aria-hidden="true" style="flex-shrink: 0; margin-top: 4px;">
        <path d="M6 32 H58" fill="none" stroke="#DAD5CC" stroke-width="1.2"></path>
        <circle cx="13" cy="22" r="3.4" fill="#C6C1B7"></circle>
        <circle cx="26" cy="40" r="5" fill="#B6B1A7"></circle>
        <circle cx="38" cy="19" r="2.6" fill="#CFCAC1"></circle>
        <circle cx="48" cy="42" r="4" fill="#C6C1B7"></circle>
        <circle cx="56" cy="26" r="2.2" fill="#D6D1C8"></circle>
        <circle cx="32" cy="32" r="1.8" fill="#55534C"></circle>
      </svg>
      <span style="flex-grow: 1;">
        <span style="display: block; font-family: 'Cormorant Garamond', Georgia, serif; font-size: 30px; font-weight: 400; color: #1C1B17; line-height: 1.1;">Vipassana</span>
        <span style="display: block; font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; color: #6E6B62; margin: 6px 0 8px;">Insight</span>
        <span style="display: block; font-size: 13px; line-height: 1.6; color: #55534C;">Whatever arises is the object. Attention stays open and notes what comes and goes.</span>
      </span>
    </button>

  </div>

  <div style="flex-grow: 1;"></div>

  <p style="margin: 0 0 22px; font-family: 'Cormorant Garamond', Georgia, serif; font-style: italic; font-weight: 300; font-size: 17px; line-height: 1.5; color: #55534C; text-wrap: pretty;">Most practices use both. Choosing one here only decides what this sitting asks of you.</p>

  <a href="Intention.dc.html" style="display: flex; align-items: center; justify-content: center; width: 100%; height: 56px; box-sizing: border-box; border: 1px solid #1C1B17; border-radius: 2px; font-size: 12px; letter-spacing: 0.26em; text-transform: uppercase; color: #1C1B17; padding-left: 0.26em;">Continue</a>
